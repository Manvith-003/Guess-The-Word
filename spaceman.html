<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceman - Word Game Hub</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0d1117">
</head>
<body>
    <div class="main">
        <div class="game-header">
            <a href="index.html" class="back-link">← Back</a>
            <div class="score-badge">
                <span id="spaceman-score">SCORE: 0</span>
            </div>
        </div>

        <div class="game-box" id="gameBox">
            <div class="spaceman-status">
                <div>Ship Integrity</div>
                <div class="hearts" id="lives">❤️❤️❤️❤️❤️❤️❤️</div>
            </div>

            <div class="word-display">
                <div class="hidden-word" id="wordDisplay">_ _ _ _</div>
                <div id="answer-feedback" class="info"></div>
            </div>

            <div class="keyboard" id="keyboard">
                <!-- Keyboard buttons will be injected by JS -->
            </div>

            <div class="btn-group" style="margin-top: 1.5rem;">
                <button class="btn-secondary" id="btnnext">Skip Word</button>
            </div>
        </div>
    </div>

    <!-- The shared words file -->
    <script src="words.js"></script>
    <script src="spaceman.js"></script>
</body>
</html>
